<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>အတည်ပြုကုဒ်</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fa;-webkit-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fa;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;border:1px solid #e6e9ef;overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="background:#0a6cff;padding:20px 32px;">
              <span style="color:#ffffff;font-size:18px;font-weight:700;letter-spacing:0.3px;">PeraperaServer</span>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:32px;">
              <h2 style="margin:0 0 16px;font-size:20px;color:#1f2430;line-height:1.4;">အတည်ပြုကုဒ်</h2>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#4a5161;">သင္သည် {{app_name}} သို႔ ဝင္ေရာက္ေနပါသည္။ သင့္၏ အတည္ျပဳကုဒ္မွာ: <span style="font-size:24px;font-weight:700;color:#0a6cff;">{{captcha}}</span></p>
              <p style="margin:0;font-size:13px;line-height:1.7;color:#8a92a3;">အတည်ပြုကုဒ်သည် ၁၀ မိနစ်အတွင်း အသုံးပြုနိုင်ပါသည်။ အခြားသူများနှင့် မျှဝေခြင်း မပြုပါနှင့်။</p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background:#f8f9fb;padding:16px 32px;border-top:1px solid #e6e9ef;">
              <p style="margin:0;font-size:12px;line-height:1.7;color:#a0a7b4;">ဤသည် သင်မဟုတ်ပါက ဤအီးမေးလ်ကို လျစ်လျူရှုပါ။</p>
              <p style="margin:8px 0 0;font-size:12px;color:#a0a7b4;">© PeraperaServer</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
