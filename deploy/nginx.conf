# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name perapera.cc;

    # 日志
    access_log /var/log/nginx/perapera_http_access.log;
    error_log /var/log/nginx/perapera_http_error.log;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name perapera.cc;

    # SSL 证书
    ssl_certificate     /etc/nginx/ssl/perapera.cc/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/perapera.cc/perapera.cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 请求体大小限制
    client_max_body_size 100M;

    # 日志
    access_log /var/log/nginx/perapera_access.log;
    error_log /var/log/nginx/perapera_error.log;

    # 反向代理到 FastAPI 应用
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态文件
    location /static {
        alias /var/www/PeraperaServer/static;
        expires 30d;
    }
}
