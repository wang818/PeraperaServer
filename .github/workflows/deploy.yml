name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/PeraperaServer

            # Pull latest code
            git pull origin main

            # Install/update dependencies
            source venv/bin/activate
            pip install -r requirements.txt

            # Apply database migrations (if any)
            alembic upgrade head

            # Restart the app
            sudo systemctl restart perapera.service

            echo "=== Deploy completed ==="
            sudo systemctl status perapera.service --no-pager

            # Send deploy-completion notification email (best-effort)
            source venv/bin/activate
            python3 scripts/notify_deploy.py --to "wangjianvip83@gmail.com" \
              || echo "部署通知邮件发送失败（不影响部署结果）"
